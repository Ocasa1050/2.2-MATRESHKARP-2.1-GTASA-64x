name: Build Matreshka RP 2.2 (Upload Build Log)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: |
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;25.2.9519653"
          sdkmanager --install "cmake;3.22.1"

      - name: Configure environment
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Fix local.properties
        run: |
          rm -f local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Fix vendor/bass libs
        run: |
          mkdir -p app/src/main/cpp/samp/vendor/bass/libs/armeabi-v7a
          mkdir -p app/src/main/cpp/samp/vendor/bass/libs/arm64-v8a
          cp app/src/main/jniLibs/armeabi-v7a/libbass.so app/src/main/cpp/samp/vendor/bass/libs/armeabi-v7a/ 2>/dev/null || true
          cp app/src/main/jniLibs/arm64-v8a/libbass.so app/src/main/cpp/samp/vendor/bass/libs/arm64-v8a/ 2>/dev/null || true

      - name: Fix jcenter
        run: sed -i 's/jcenter()/mavenCentral()/g' build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        run: |
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build_debug_log.txt
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        continue-on-error: true

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        run: |
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build_release_log.txt
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        continue-on-error: true

      - name: Extract error summary
        if: always()
        run: |
          {
            echo "========================================"
            echo "=== BUILD ERROR SUMMARY ==="
            echo "========================================"
            echo ""
            echo "--- SEARCHING FOR ALL ERRORS ---"
            echo ""
            
            LOG_FILE="build_debug_log.txt"
            if [ ! -f "$LOG_FILE" ]; then
              LOG_FILE="build_release_log.txt"
            fi
            
            echo "Analyzing: $LOG_FILE"
            echo ""
            
            echo "1. FIRST COMPILATION ERROR:"
            grep -n -m1 -i "error:" "$LOG_FILE" || echo "   No 'error:' found"
            echo ""
            
            echo "2. FIRST FATAL ERROR:"
            grep -n -m1 -i "fatal error" "$LOG_FILE" || echo "   No 'fatal error' found"
            echo ""
            
            echo "3. FIRST NINJA ERROR:"
            grep -n -m1 -i "ninja: error" "$LOG_FILE" || echo "   No 'ninja error' found"
            echo ""
            
            echo "4. FIRST CMAKE ERROR:"
            grep -n -m1 -i "cmake error" "$LOG_FILE" || echo "   No 'CMake error' found"
            echo ""
            
            echo "5. FIRST MISSING FILE:"
            grep -n -m1 -i "no such file or directory" "$LOG_FILE" || echo "   No missing file found"
            echo ""
            
            echo "6. FIRST DEPENDENCY ERROR:"
            grep -n -m1 -i "could not find" "$LOG_FILE" || echo "   No dependency error found"
            echo ""
            
            echo "7. FIRST JAVA ERROR:"
            grep -n -m1 -i "cannot find symbol" "$LOG_FILE" || echo "   No Java error found"
            echo ""
            
            echo "8. LAST 50 LINES OF LOG:"
            echo "----------------------------------------"
            tail -50 "$LOG_FILE"
            
          } | tee error_summary.txt

      - name: Upload full build log (DEBUG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build_debug_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload full build log (RELEASE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: build_release_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload error summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-summary
          path: error_summary.txt
          retention-days: 7

      - name: Upload APK if success
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: matrp-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7
