name: Auto-Fix-Build-SPACE-RP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "34"
  NDK_VERSION: "25.2.9519653"

jobs:
  fix-and-build:
    name: Fix-and-Build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      # ─── Checkout ─────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Fix 1: Remove exposed keystore ───────────
      - name: Remove exposed keystore
        run: rm -f app/edgar.jks

      # ─── Fix 2: Create new build.gradle ───────────
      - name: Create fixed build.gradle
        run: |
          cat > app/build.gradle << 'GRADLEOF'
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 34
    namespace 'ru.edgar.space'

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def keystoreFile = System.getenv("CI_KEYSTORE_FILE")
            if (keystoreFile != null) {
                storeFile file(keystoreFile)
                storePassword System.getenv("CI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CI_KEY_ALIAS")
                keyPassword System.getenv("CI_KEY_PASSWORD")
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId 'ru.edgar.space'
        minSdk 26
        targetSdk 34
        versionCode 105
        versionName "0.8.2.1"
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        buildConfigField "int", "VK_APP_ID", System.getenv("VK_APP_ID") ?: "51874098"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    ndkVersion "25.2.9519653"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/release/out/lib'
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
            }
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        all {
            multiDexEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError false
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'ru.egslava:MaskedEditText:1.0.5'
    implementation 'com.dinuscxj:circleprogressbar:1.3.6'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'com.github.smarteist:autoimageslider:1.4.0'
    implementation 'com.github.skydoves:colorpickerview:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.mindorks.android:prdownloader:0.6.0'
    implementation 'com.liulishuo.filedownloader:library:1.7.7'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'com.hzy:un7zip:1.7.1'
    implementation 'com.github.hzy3774:AndroidP7zip:v1.7.2'
    implementation platform('com.google.firebase:firebase-bom:32.4.0')
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'com.google.firebase:firebase-database:20.3.1'
    implementation 'com.google.firebase:firebase-config:21.6.0'
    implementation 'com.google.firebase:firebase-auth:22.3.1'
    implementation 'com.google.firebase:firebase-analytics:21.6.1'
    implementation 'com.vk:android-sdk-core:3.0.0'
    implementation 'com.google.android.gms:play-services-auth:20.2.0'
    implementation "com.joom.paranoid:paranoid-gradle-plugin:0.3.14"
    implementation 'com.bytedance.android:shadowhook:1.0.9'
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.multidex:multidex-instrumentation:2.0.0'
}
GRADLEOF

      # ─── Fix 3: Fix MainActivity VK ID ────────────
      - name: Fix VK App ID
        run: |
          FILE="app/src/main/java/ru/edgar/launcher/activity/MainActivity.java"
          if [ -f "$FILE" ]; then
            sed -i 's/51874098/BuildConfig.VK_APP_ID/g' "$FILE"
          fi

      # ─── Fix 4: Fix AndroidManifest.xml ───────────
      - name: Fix AndroidManifest.xml
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/usesCleartextTraffic="true"/usesCleartextTraffic="false"/g' "$MANIFEST"
          fi

      # ─── Fix 5: Create network_security_config.xml ─
      - name: Create network security config
        run: |
          mkdir -p app/src/main/res/xml
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<network-security-config>' \
            '    <base-config cleartextTrafficPermitted="false">' \
            '        <trust-anchors>' \
            '            <certificates src="system" />' \
            '        </trust-anchors>' \
            '    </base-config>' \
            '</network-security-config>' \
            > app/src/main/res/xml/network_security_config.xml

      # ─── Fix 6: Add networkSecurityConfig to manifest ─
      - name: Add networkSecurityConfig
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q "networkSecurityConfig" "$MANIFEST"; then
            sed -i 's/usesCleartextTraffic="false"/usesCleartextTraffic="false" android:networkSecurityConfig="@xml\/network_security_config"/g' "$MANIFEST"
          fi

      # ─── Setup Java ───────────────────────────────
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # ─── Setup Android SDK ────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          sdkmanager "cmake;3.22.1"

      # ─── Cache ────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      # ─── Create debug keystore ────────────────────
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storepass android \
              -keypass android
          fi

      # ─── Build Debug ──────────────────────────────
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ─── Check Debug APK ──────────────────────────
      - name: Check Debug APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No Debug APK found"
            exit 1
          fi
          ls -lh "$APK"

      # ─── Upload Debug APK ─────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ─── Build Release ────────────────────────────
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # ─── Check Release APK ────────────────────────
      - name: Check Release APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No Release APK found"
            exit 1
          fi
          ls -lh "$APK"

      # ─── Upload Release APK ───────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
