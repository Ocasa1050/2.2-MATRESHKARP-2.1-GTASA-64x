name: Auto-Fix-Build-SPACE-RP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "34"
  NDK_VERSION: "25.2.9519653"

jobs:
  build:
    name: Build-APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove exposed keystore
        run: rm -f app/edgar.jks

      - name: Fix build.gradle with sed
        run: |
          # Backup
          cp app/build.gradle app/build.gradle.bak
          
          # Fix 1: Remove allprojects from android block
          sed -i '/allprojects\s*{[^}]*}/d' app/build.gradle || true
          
          # Fix 2: Replace signing configs
          sed -i "s|storeFile file('edgar.jks')|storeFile file(System.getProperty(\"user.home\") + \"/.android/debug.keystore\")|g" app/build.gradle
          sed -i "s|storePassword 'edgar333'|storePassword \"android\"|g" app/build.gradle
          sed -i "s|keyAlias 'key0'|keyAlias \"androiddebugkey\"|g" app/build.gradle
          sed -i "s|keyPassword 'edgar333'|keyPassword \"android\"|g" app/build.gradle
          
          # Fix 3: Fix debug build type
          sed -i 's/debuggable false/debuggable true/g' app/build.gradle
          sed -i 's/jniDebuggable false/jniDebuggable true/g' app/build.gradle
          
          # Fix 4: Fix release build type
          sed -i 's/minifyEnabled false/minifyEnabled true/g' app/build.gradle
          
          # Fix 5: Fix lint
          sed -i 's/checkReleaseBuilds false/checkReleaseBuilds true/g' app/build.gradle

      - name: Fix VK App ID
        run: sed -i 's/51874098/BuildConfig.VK_APP_ID/g' app/src/main/java/ru/edgar/launcher/activity/MainActivity.java || true

      - name: Fix AndroidManifest.xml
        run: sed -i 's/usesCleartextTraffic="true"/usesCleartextTraffic="false"/g' app/src/main/AndroidManifest.xml || true

      - name: Create network security config
        run: |
          mkdir -p app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/xml/network_security_config.xml
          echo '<network-security-config>' >> app/src/main/res/xml/network_security_config.xml
          echo '    <base-config cleartextTrafficPermitted="false">' >> app/src/main/res/xml/network_security_config.xml
          echo '        <trust-anchors>' >> app/src/main/res/xml/network_security_config.xml
          echo '            <certificates src="system" />' >> app/src/main/res/xml/network_security_config.xml
          echo '        </trust-anchors>' >> app/src/main/res/xml/network_security_config.xml
          echo '    </base-config>' >> app/src/main/res/xml/network_security_config.xml
          echo '</network-security-config>' >> app/src/main/res/xml/network_security_config.xml

      - name: Add networkSecurityConfig to manifest
        run: |
          if ! grep -q "networkSecurityConfig" app/src/main/AndroidManifest.xml; then
            sed -i 's/usesCleartextTraffic="false"/usesCleartextTraffic="false" android:networkSecurityConfig="@xml\/network_security_config"/g' app/src/main/AndroidManifest.xml
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          sdkmanager "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storepass android -keypass android
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check Debug APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: No APK"; exit 1; fi
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
