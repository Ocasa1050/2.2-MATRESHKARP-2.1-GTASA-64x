name: Diagnose-Build

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Print EVERYTHING
        run: |
          echo "=== FILES ==="
          find . -maxdepth 2 -type f | sort
          
          echo "=== build.gradle (project) ==="
          cat build.gradle 2>/dev/null || echo "MISSING"
          
          echo "=== app/build.gradle ==="
          cat app/build.gradle 2>/dev/null || echo "MISSING"
          
          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || echo "MISSING"
          
          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null || echo "MISSING"
          
          echo "=== gradlew ==="
          ls -la gradlew 2>/dev/null || echo "MISSING"
          
          echo "=== gradle/wrapper ==="
          ls -la gradle/wrapper/ 2>/dev/null || echo "MISSING"
          
          echo "=== google-services.json ==="
          ls -la app/google-services.json 2>/dev/null || echo "MISSING"
          
          echo "=== CMakeLists.txt ==="
          find . -name "CMakeLists.txt" 2>/dev/null || echo "MISSING"
      
      - name: Try build and capture FULL error
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log || true
          echo "=== LAST 100 LINES ==="
          tail -100 build.log 2>/dev/null || echo "NO LOG"
      
      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis
          path: build.log
