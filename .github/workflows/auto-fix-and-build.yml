name: Build-APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Set UTF-8 Locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

      - uses: actions/checkout@v4

      # ========== إصلاح أسماء الملفات ==========
      - name: Fix social club folder (space in name)
        run: |
          if [ -d "app/src/main/assets/social club" ]; then
            mv "app/src/main/assets/social club/socialClubAssets.json" "app/src/main/assets/socialclub/" 2>/dev/null || true
            rm -rf "app/src/main/assets/social club"
          fi

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' gradlew

      # ========== إصلاح allprojects داخل android block ==========
      - name: Fix allprojects inside android block
        run: |
          sed -i '/allprojects {repositories {maven { url .https:\/\/maven.aliyun.com\/repository\/jcenter. }}}}/d' app/build.gradle

      # ========== إنشاء ملفات مفقودة ==========
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug"

      - name: Create dummy google-services.json
        run: |
          echo '{
            "project_info": {
              "project_number": "123456789",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": {
                    "package_name": "ru.edgar.space"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy-api-key"
                  }
                ]
              }
            ]
          }' > app/google-services.json

      # ========== تثبيت البيئة ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK & CMake & Build Tools
        run: |
          sdkmanager "ndk;25.2.9519653"
          sdkmanager "cmake;3.22.1"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"

      - name: Verify file names (Case Check)
        run: |
          echo "Checking case-sensitive paths..."
          test -f gradlew || (echo "gradlew not found!" && exit 1)
          test -f app/src/main/cpp/CMakeLists.txt || (echo "CMakeLists.txt not found!" && exit 1)
          test -d app/src/main/cpp/opus || (echo "opus directory not found!" && exit 1)
          test -d app/src/main/cpp/samp || (echo "samp directory not found!" && exit 1)
          test -d app/src/main/cpp/samp/vendor/imgui || (echo "imgui directory not found!" && exit 1)
          test -d app/src/main/cpp/samp/vendor/bass || (echo "bass directory not found!" && exit 1)
          test -d app/src/main/cpp/samp/vendor/armhook || (echo "armhook directory not found!" && exit 1)
          test -d app/src/main/cpp/samp/game/RW || (echo "RW directory not found!" && exit 1)
          test -d app/src/main/cpp/samp/game/Core || (echo "Core directory not found!" && exit 1)
          test -d app/src/main/cpp/samp/util || (echo "util directory not found!" && exit 1)
          echo "All paths OK!"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
