name: Build-APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Set UTF-8 Locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

      - uses: actions/checkout@v4

      # ========== إصلاح أسماء الملفات ==========
      - name: Fix social club folder (space in name)
        run: |
          if [ -d "app/src/main/assets/social club" ]; then
            mv "app/src/main/assets/social club/socialClubAssets.json" "app/src/main/assets/socialclub/" 2>/dev/null || true
            rm -rf "app/src/main/assets/social club"
          fi

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' gradlew

      # ========== إصلاحات Gradle داخل الـ Workflow فقط ==========
      - name: Fix allprojects inside android block
        run: |
          # حذف allprojects من داخل android {} — خطأ Gradle صياغي
          sed -i '/allprojects {repositories {maven { url .https:\/\/maven.aliyun.com\/repository\/jcenter. }}}}/d' app/build.gradle

      - name: Fix paranoid plugin in dependencies
        run: |
          # حذف paranoid-gradle-plugin من dependencies (هو plugin وليس dependency)
          sed -i '/implementation "com.joom.paranoid:paranoid-gradle-plugin:0.3.14"/d' app/build.gradle

      - name: Fix Crashlytics native symbols for debug
        run: |
          # تعطيل رفع رموز native في debug لتجنب الأخطاء
          sed -i 's/nativeSymbolUploadEnabled true/nativeSymbolUploadEnabled false/' app/build.gradle

      # ========== التحقق من الملفات الحساسة ==========
      - name: Verify critical files exist
        run: |
          echo "=== Checking critical files ==="
          test -f app/google-services.json && echo "✓ google-services.json" || (echo "✗ google-services.json missing!" && exit 1)
          test -f app/edgar.jks && echo "✓ edgar.jks" || (echo "✗ edgar.jks missing!" && exit 1)
          test -f gradlew && echo "✓ gradlew" || (echo "✗ gradlew missing!" && exit 1)
          test -f app/src/main/cpp/CMakeLists.txt && echo "✓ CMakeLists.txt" || (echo "✗ CMakeLists.txt missing!" && exit 1)
          test -d app/src/main/cpp/opus && echo "✓ opus/" || (echo "✗ opus/ missing!" && exit 1)
          test -d app/src/main/cpp/samp && echo "✓ samp/" || (echo "✗ samp/ missing!" && exit 1)
          test -d app/src/main/cpp/samp/vendor/imgui && echo "✓ imgui/" || (echo "✗ imgui/ missing!" && exit 1)
          test -d app/src/main/cpp/samp/vendor/bass && echo "✓ bass/" || (echo "✗ bass/ missing!" && exit 1)
          test -d app/src/main/cpp/samp/vendor/armhook && echo "✓ armhook/" || (echo "✗ armhook/ missing!" && exit 1)
          test -d app/src/main/cpp/samp/game/RW && echo "✓ RW/" || (echo "✗ RW/ missing!" && exit 1)
          test -d app/src/main/cpp/samp/game/Core && echo "✓ Core/" || (echo "✗ Core/ missing!" && exit 1)
          test -d app/src/main/cpp/samp/util && echo "✓ util/" || (echo "✗ util/ missing!" && exit 1)
          echo "=== All checks passed ==="

      # ========== تثبيت البيئة ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK & CMake & Build Tools
        run: |
          sdkmanager "ndk;25.2.9519653"
          sdkmanager "cmake;3.22.1"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ========== البناء ==========
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
