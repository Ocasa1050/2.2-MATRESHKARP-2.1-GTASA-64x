name: Build MATRESHKA RP APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # ─── 1. Checkout ───
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 2. Setup JDK ───
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ─── 3. Setup Android SDK ───
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─── 4. Setup NDK ───
      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      # ─── 5. Cache Gradle ───
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── 6. Create Dummy Keystore (للبناء فقط) ───
      - name: Create dummy keystore
        run: |
          mkdir -p app
          keytool -genkey -v \
            -keystore app/edgar.jks \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass edgar333 \
            -keypass edgar333 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ─── 7. Grant execute permission ───
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ─── 8. Build Debug APK ───
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ─── 9. Build Release APK ───
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'edgar333' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'edgar333' }}

      # ─── 10. Upload Debug APK ───
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # ─── 11. Upload Release APK ───
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      # ─── 12. Upload Build Reports ───
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 3
