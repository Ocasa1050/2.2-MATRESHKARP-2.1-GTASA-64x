name: Build MATRESHKA RP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.parallel=true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install NDK/CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Auto-fix root build.gradle (replace jcenter)
        run: |
          if [ -f build.gradle ]; then
            sed -i 's/jcenter()/mavenCentral()/g' build.gradle
            echo "Fixed root build.gradle"
          fi

      - name: Auto-fix app/build.gradle (remove misplaced allprojects)
        run: |
          if [ -f app/build.gradle ]; then
            sed -i "/allprojects {repositories {maven { url 'https:\/\/maven.aliyun.com\/repository\/jcenter' }}}}/d" app/build.gradle
            echo "Fixed app/build.gradle"
          fi

      - name: Setup signing keystore
        run: |
          if [ -f app/edgar.jks ]; then
            echo "Using existing keystore"
          else
            keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Android Debug,O=Android,C=US"
            echo "Created new keystore"
          fi

      - name: Verify google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing!"
            exit 1
          fi
          echo "google-services.json found"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --info || true

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --info || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Build Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Reports
          path: |
            app/build/reports/
            app/build/outputs/
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "========== BUILD SUMMARY =========="
          if ls app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            echo "DEBUG APK:"
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "DEBUG APK: FAILED"
          fi
          if ls app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            echo "RELEASE APK:"
            ls -lh app/build/outputs/apk/release/*.apk
          else
            echo "RELEASE APK: FAILED"
          fi
          echo "==================================="
