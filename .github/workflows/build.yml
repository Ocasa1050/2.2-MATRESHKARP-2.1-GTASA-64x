name: Build MATRESHKA RP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fix root build.gradle - replace jcenter
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle

      - name: Fix app build.gradle - remove allprojects block
        run: |
          grep -v "allprojects {repositories {maven { url" app/build.gradle > app/build.gradle.tmp
          mv app/build.gradle.tmp app/build.gradle

      - name: Fix app build.gradle - remove paranoid plugin
        run: |
          grep -v "com.joom.paranoid:paranoid-gradle-plugin" app/build.gradle > app/build.gradle.tmp
          mv app/build.gradle.tmp app/build.gradle

      - name: Add shadowhook maven repo to root build.gradle
        run: |
          if ! grep -q "artifact.bytedance.com" build.gradle; then
            sed -i "/maven { url 'https:\/\/artifacts.applovin.com\/android' }/a\\        maven { url 'https:\/\/artifact.bytedance.com\/repository\/Volcengine\/' }" build.gradle
            echo "Added shadowhook repo"
          else
            echo "Shadowhook repo already exists"
          fi

      - name: Verify google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing!"
            exit 1
          fi
          echo "google-services.json found"

      - name: Setup keystore
        run: |
          if [ ! -f app/edgar.jks ]; then
            keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        timeout-minutes: 45
        run: |
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -x test -x lint --stacktrace 2>&1 | tee debug-build.log || true

      - name: Build Release APK
        timeout-minutes: 45
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -x test -x lint --stacktrace 2>&1 | tee release-build.log || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Logs
          path: |
            debug-build.log
            release-build.log
          retention-days: 7
