name: Build Matreshka RP 2.2 (Fallback Mode)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: |
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;25.2.9519653"
          sdkmanager --install "cmake;3.22.1"

      - name: Configure environment
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Fix local.properties
        run: |
          rm -f local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Fix build.gradle (root)
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle

      - name: Fix app/build.gradle
        run: |
          # Remove misplaced allprojects line
          sed -i "/allprojects {repositories {maven { url 'https:\/\/maven.aliyun.com\/repository\/jcenter' }}}/d" app/build.gradle
          # Update shadowhook
          sed -i "s/com.bytedance.android:shadowhook:1.0.9/com.bytedance.android:shadowhook:2.0.1/g" app/build.gradle

      - name: Fix gradle.properties
        run: |
          if ! grep -q "android.prefabVersion" gradle.properties; then
            echo "android.prefabVersion=2.0.0" >> gradle.properties
          fi

      - name: Download shadowhook AAR manually (fallback)
        run: |
          # If prefab fails, we can extract .so manually
          mkdir -p shadowhook_aar
          cd shadowhook_aar
          # Download from Maven Central
          curl -L -o shadowhook.aar "https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/2.0.1/shadowhook-2.0.1.aar" ||           curl -L -o shadowhook.aar "https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/1.0.10/shadowhook-1.0.10.aar" ||           curl -L -o shadowhook.aar "https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/1.0.9/shadowhook-1.0.9.aar" || true

          if [ -f shadowhook.aar ]; then
            echo "Downloaded shadowhook.aar successfully"
            unzip -o shadowhook.aar -d shadowhook_extracted || true
            find shadowhook_extracted -name "*.so" -type f
            # Copy to jniLibs
            mkdir -p ../app/src/main/jniLibs/armeabi-v7a
            mkdir -p ../app/src/main/jniLibs/arm64-v8a
            cp shadowhook_extracted/jni/armeabi-v7a/libshadowhook.so ../app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true
            cp shadowhook_extracted/jni/arm64-v8a/libshadowhook.so ../app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
            cp shadowhook_extracted/jni/armeabi-v7a/libshadowhook_nothing.so ../app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true
            cp shadowhook_extracted/jni/arm64-v8a/libshadowhook_nothing.so ../app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          else
            echo "WARNING: Could not download shadowhook.aar"
          fi
          cd ..

      - name: Fix CMakeLists.txt (fallback for shadowhook)
        run: |
          # If prefab fails, modify CMakeLists to use manual .so
          if [ -f app/src/main/jniLibs/armeabi-v7a/libshadowhook.so ]; then
            echo "libshadowhook.so found in jniLibs - patching CMakeLists.txt"
            sed -i 's/find_package(shadowhook REQUIRED CONFIG)/# find_package(shadowhook REQUIRED CONFIG) - using manual .so/g' app/src/main/cpp/samp/CMakeLists.txt
            sed -i 's/shadowhook::shadowhook/\${CMAKE_CURRENT_SOURCE_DIR}\/..\/..\/jniLibs\/\${ANDROID_ABI}\/libshadowhook.so/g' app/src/main/cpp/samp/CMakeLists.txt
            echo "=== Patched CMakeLists.txt ==="
            cat app/src/main/cpp/samp/CMakeLists.txt
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        run: |
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build_debug_log.txt
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        continue-on-error: true

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        run: |
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build_release_log.txt
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        continue-on-error: true

      - name: Extract errors
        if: always()
        run: |
          LOG="build_debug_log.txt"
          [ ! -f "$LOG" ] && LOG="build_release_log.txt"
          echo "=== FIRST 5 ERRORS ==="
          grep -n -m5 -i "error:" "$LOG" || true
          echo ""
          echo "=== LAST 30 LINES ==="
          tail -30 "$LOG"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_debug_log.txt
            build_release_log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: matrp-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 7
