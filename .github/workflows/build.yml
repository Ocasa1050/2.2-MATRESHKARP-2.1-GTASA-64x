name: Build MATRESHKA RP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.parallel=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fix root build.gradle
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle

      - name: Fix app/build.gradle
        run: |
          sed -i "/allprojects {repositories {maven { url 'https:\/\/maven.aliyun.com\/repository\/jcenter' }}}}/d" app/build.gradle
          sed -i '/com.joom.paranoid:paranoid-gradle-plugin/d' app/build.gradle

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          printf '%s
' '{' '  "project_info": {' '    "project_number": "123456789",' '    "project_id": "dummy-project",' '    "storage_bucket": "dummy-project.appspot.com"' '  },' '  "client": [' '    {' '      "client_info": {' '        "mobilesdk_app_id": "1:123456789:android:abcdef123456",' '        "android_client_info": {' '          "package_name": "ru.edgar.space"' '        }' '      },' '      "api_key": [{"current_key": "dummy-key"}],' '      "services": {' '        "appinvite_service": {' '          "other_platform_oauth_client": []' '        }' '      }' '    }' '  ]' '}' > app/google-services.json

      - name: Setup keystore
        run: |
          if [ ! -f app/edgar.jks ]; then
            keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        timeout-minutes: 45
        run: |
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --build-cache -x test -x lint --stacktrace 2>&1 | tee debug-build.log || true

      - name: Build Release APK
        timeout-minutes: 45
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --build-cache -x test -x lint --stacktrace 2>&1 | tee release-build.log || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Logs
          path: |
            debug-build.log
            release-build.log
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "========== BUILD SUMMARY =========="
          echo "--- Debug APK ---"
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "DEBUG APK: NOT BUILT"
          echo "--- Release APK ---"
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || echo "RELEASE APK: NOT BUILT"
          echo "==================================="
