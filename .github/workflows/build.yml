name: Build MATRESHKA RP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fix root build.gradle - replace jcenter
        run: |
          echo "=== FIXING root build.gradle ==="
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle
          echo "Done"

      - name: Fix app/build.gradle - remove allprojects block
        run: |
          echo "=== FIXING app/build.gradle ==="
          sed -i "/allprojects {repositories {maven { url 'https:\/\/maven.aliyun.com\/repository\/jcenter' }}}}/d" app/build.gradle
          echo "Done"

      - name: Fix app/build.gradle - remove paranoid plugin
        run: |
          echo "=== Removing paranoid from dependencies ==="
          sed -i '/com.joom.paranoid:paranoid-gradle-plugin/d' app/build.gradle
          echo "Done"

      - name: Create dummy google-services.json
        run: |
          echo "=== Creating dummy google-services.json ==="
          mkdir -p app
          echo '{' > app/google-services.json
          echo '  "project_info": {' >> app/google-services.json
          echo '    "project_number": "123456789",' >> app/google-services.json
          echo '    "project_id": "dummy-project",' >> app/google-services.json
          echo '    "storage_bucket": "dummy-project.appspot.com"' >> app/google-services.json
          echo '  },' >> app/google-services.json
          echo '  "client": [' >> app/google-services.json
          echo '    {' >> app/google-services.json
          echo '      "client_info": {' >> app/google-services.json
          echo '        "mobilesdk_app_id": "1:123456789:android:abcdef123456",' >> app/google-services.json
          echo '        "android_client_info": {' >> app/google-services.json
          echo '          "package_name": "ru.edgar.space"' >> app/google-services.json
          echo '        }' >> app/google-services.json
          echo '      },' >> app/google-services.json
          echo '      "api_key": [{"current_key": "dummy-key"}],' >> app/google-services.json
          echo '      "services": {' >> app/google-services.json
          echo '        "appinvite_service": {' >> app/google-services.json
          echo '          "other_platform_oauth_client": []' >> app/google-services.json
          echo '        }' >> app/google-services.json
          echo '      }' >> app/google-services.json
          echo '    }' >> app/google-services.json
          echo '  ]' >> app/google-services.json
          echo '}' >> app/google-services.json
          echo "Done"

      - name: Setup keystore
        run: |
          echo "=== Setting up keystore ==="
          if [ -f app/edgar.jks ]; then
            echo "Using existing edgar.jks"
          else
            keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Android Debug,O=Android,C=US"
            echo "Created new keystore"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --info 2>&1 | tee debug-build.log || true

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace --info 2>&1 | tee release-build.log || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Logs
          path: |
            debug-build.log
            release-build.log
            app/build/reports/
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "========== BUILD SUMMARY =========="
          echo ""
          echo "--- Debug APK ---"
          if ls app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "DEBUG APK: NOT BUILT"
            tail -30 debug-build.log || true
          fi
          echo ""
          echo "--- Release APK ---"
          if ls app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            ls -lh app/build/outputs/apk/release/*.apk
          else
            echo "RELEASE APK: NOT BUILT"
            tail -30 release-build.log || true
          fi
          echo ""
          echo "==================================="
