name: Build Matreshka RP 2.2 (64x + 32x)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Required for large .so files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: |
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "ndk;25.2.9519653"
          sdkmanager --install "cmake;3.22.1"
          echo "=== Installed components ==="
          sdkmanager --list_installed | grep -E "ndk|cmake|platform|build-tools" || true

      - name: Configure NDK & CMake environment
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          CMAKE_PATH="$ANDROID_SDK_ROOT/cmake/3.22.1/bin"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "$CMAKE_PATH" >> $GITHUB_PATH
          echo "NDK: $NDK_PATH"
          echo "CMake: $CMAKE_PATH"
          ls -la "$NDK_PATH" 2>/dev/null | head -5 || echo "NDK not found!"
          ls -la "$CMAKE_PATH" 2>/dev/null | head -5 || echo "CMake not found!"

      - name: Fix local.properties for CI
        run: |
          rm -f local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.22.1" >> local.properties
          cat local.properties

      - name: Verify project structure
        run: |
          echo "=== Checking critical files ==="
          test -f app/build.gradle && echo "✓ app/build.gradle" || echo "✗ app/build.gradle MISSING"
          test -f app/google-services.json && echo "✓ google-services.json" || echo "✗ google-services.json MISSING"
          test -f app/edgar.jks && echo "✓ edgar.jks" || echo "✗ edgar.jks MISSING"
          test -f app/src/main/cpp/CMakeLists.txt && echo "✓ cpp/CMakeLists.txt" || echo "✗ cpp/CMakeLists.txt MISSING"
          test -d app/src/main/jniLibs/armeabi-v7a && echo "✓ jniLibs/armeabi-v7a" || echo "✗ jniLibs/armeabi-v7a MISSING"
          test -d app/src/main/jniLibs/arm64-v8a && echo "✓ jniLibs/arm64-v8a" || echo "✗ jniLibs/arm64-v8a MISSING"
          echo "=== Checking vendor/bass (CMake dependency) ==="
          test -f app/src/main/cpp/samp/vendor/bass/libs/armeabi-v7a/libbass.so && echo "✓ vendor/bass armv7" || echo "⚠ vendor/bass armv7 MISSING (CMake may fail)"
          test -f app/src/main/cpp/samp/vendor/bass/libs/arm64-v8a/libbass.so && echo "✓ vendor/bass arm64" || echo "⚠ vendor/bass arm64 MISSING (CMake may fail)"
          echo "=== .so files in jniLibs ==="
          find app/src/main/jniLibs -type f -name "*.so" | wc -l
          find app/src/main/jniLibs -type f -name "*.so" | head -20

      - name: Fix repositories (jcenter workaround)
        run: |
          echo "=== Root build.gradle repositories ==="
          grep -n "jcenter\|mavenCentral\|google" build.gradle || true
          echo "=== App build.gradle repositories ==="
          grep -n "jcenter\|mavenCentral\|google\|aliyun" app/build.gradle || true
          echo "Note: jcenter is deprecated but maven.aliyun.com mirror may work."
          echo "If build fails with 'Could not find dependency', you may need to update repositories."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        run: ./gradlew assembleDebug --stacktrace --info
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        run: ./gradlew assembleRelease --stacktrace --info
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Inspect build outputs
        if: always()
        run: |
          echo "=== APK outputs ==="
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true
          echo "=== Native libraries in build ==="
          find app/build/intermediates -type f -name "*.so" 2>/dev/null | head -30 || true
          echo "=== Build logs ==="
          test -f app/build/outputs/logs && cat app/build/outputs/logs || true

      - name: Upload Debug APK
        if: always() && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '')
        uses: actions/upload-artifact@v4
        with:
          name: matrp-22-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Release APK
        if: always() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '')
        uses: actions/upload-artifact@v4
        with:
          name: matrp-22-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native libs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrp-22-native-libs
          path: |
            app/build/intermediates/merged_native_libs/**/*.so
            app/build/intermediates/stripped_native_libs/**/*.so
          if-no-files-found: ignore
          retention-days: 3
